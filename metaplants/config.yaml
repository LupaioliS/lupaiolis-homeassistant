name: "MetaPlants"
version: "1.9.2"
slug: "metaplants"
description: "Home Assistant add-on to manage household plants: watering, fertilizing, repotting, pruning, and health issue history"
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 3000
homeassistant_api: true
panel_icon: "mdi:flower"
map:
  - data:rw
options:
  mqtt_url: "mqtt://core-mosquitto:1883"
  mqtt_user: ""
  mqtt_pass: ""
  ha_discovery_prefix: "homeassistant"
  lang: "it"
schema:
  mqtt_url: str
  mqtt_user: str?
  mqtt_pass: password?
  ha_discovery_prefix: str
  lang: "list(it|en)"